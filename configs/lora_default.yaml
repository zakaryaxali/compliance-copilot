# Default LoRA fine-tuning config for compliance-copilot.

base_model: mistralai/Mistral-7B-Instruct-v0.3
max_seq_length: 2048
load_in_4bit: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
  bias: none

training:
  output_dir: ./checkpoints
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.01
  optim: adamw_8bit
  logging_steps: 10
  save_strategy: epoch
  eval_strategy: epoch
  bf16: true
  seed: 42

data:
  train_path: data/synthetic/train.jsonl
  eval_path: data/eval/held_out.jsonl
